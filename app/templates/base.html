<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}DeviceManager{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/vendor/xterm.css" />
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark"></span>DeviceManager</a>
    {% if request.session.get("is_admin") %}
    <form method="post" action="/logout">
      <button type="submit" class="secondary">Log out</button>
    </form>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <aside id="terminal-pane" class="terminal-pane" hidden>
    <section id="term-section" class="pane-section" hidden>
      <div class="term-head">
        <span class="term-title" id="term-title">Terminal</span>
        <select id="term-user" class="term-user" title="Login user"></select>
        <button type="button" id="term-connect" class="secondary" disabled>Connect</button>
        <span class="spacer"></span>
        <input type="file" id="term-file" hidden>
        <button type="button" id="term-upload" class="secondary" title="Upload a file to the selected user's home dir">↑ Upload</button>
        <button type="button" id="term-close" class="secondary" title="Close terminal">✕</button>
      </div>
      <div id="term-body" class="term-body"></div>
      <div id="term-status" class="term-status"></div>
    </section>
    <section id="logs-section" class="pane-section" hidden>
      <div class="term-head">
        <span class="term-title" id="logs-title">Logs</span>
        <span class="spacer"></span>
        <button type="button" id="logs-close" class="secondary" title="Close logs">✕</button>
      </div>
      <pre id="logs-body" class="logs-body"></pre>
    </section>
  </aside>

  <script src="/static/vendor/xterm.js"></script>
  <script src="/static/vendor/xterm-addon-fit.js"></script>
  <script src="/static/app.js?v={{ static_version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
